[project]
name = "adspub"
version = "0.1.1"
description = "Machine-readable view of the Google Ad Manager API version list, with a CLI for humans and AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eivind Teig", email = "eivind.teig@gmail.com" }]
requires-python = ">=3.11"
keywords = ["google", "ad-manager", "dfp", "api", "versions", "deprecation", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "platformdirs>=4",
  "pydantic>=2.7",
  "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/eivl/adspub"
Repository = "https://github.com/eivl/adspub"
Issues = "https://github.com/eivl/adspub/issues"
Changelog = "https://github.com/eivl/adspub/blob/main/CHANGELOG.md"

[project.scripts]
adspub = "adspub.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pre-commit>=4",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "ISC", "PIE",
  "PT", "RET", "SIM", "TID", "ARG", "PTH", "ERA", "PL", "RUF", "ANN", "FBT",
]
ignore = [
  "PLR0913", "PLR0917", # many arguments is fine for CLI entry points
  "FBT001", "FBT002", # boolean flags are the point of a CLI
  "ANN401", # Any is used for click context objects
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "ANN", "ARG"]

[tool.ruff.lint.isort]
known-first-party = ["adspub"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["adspub"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
