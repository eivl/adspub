name: Render demo

# Re-renders demo/demo.gif from demo/demo.tape with VHS and commits the result.

on:
  push:
    branches: [main]
    paths: ["demo/demo.tape"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vhs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - uses: charmbracelet/vhs-action@v2
        with:
          path: demo/demo.tape
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Update demo GIF
          file_pattern: demo/demo.gif
